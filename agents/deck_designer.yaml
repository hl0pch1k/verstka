name: deck_designer
version: 2.2.0
description: >
  Агент v2 (verstka.planning.agent.run_agent): аналитик читает бриф (слайды, заказанные диаграммы, таблицы, формулы,
  данные), архитектор составляет сюжет, если бриф не расписан по слайдам, дизайнер проектирует каждый слайд отдельно
  (форма, заголовок-вывод, вывод, заметки, данные диаграмм, две альтернативы), критик проверяет план каждого варианта,
  дизайнер правит отмеченные слайды (один круг), компилятор собирает колоду и сверяет её с брифом.
steps:
  - skill: topic_reference
    description: автор (режим автора, planning/writer.py) — статьи Википедии по теме и её тип; только когда в тексте одна тема
    optional: true
  - skill: deck_writer
    description: автор — пишет текст презентации по теме (по статье, если она нашлась); дальше агент читает его как текст пользователя
    optional: true
  - skill: writer_check
    description: автор — проверка фактов написанного текста, только удаление; пропускается, когда не хватает времени
    optional: true
  - skill: data_extractor
    description: аналитик — данные блоков брифа, которые не прочитали правила (planning/brief_structure.py)
    optional: true
  - skill: deck_architect
    description: сюжет презентации, когда бриф не расписан по слайдам
    optional: true
  - skill: slide_designer
    description: один вызов на слайд, параллельно; без модели — слайд по правилам из описания слайда
  - skill: design_critic
    description: замечания к плану каждого варианта; пропускается, когда не хватает времени
    optional: true
  - skill: slide_designer
    description: правка отмеченных критиком слайдов, один круг
    optional: true
changelog:
  - "2.0.0: аналитик → архитектор → дизайнер по слайду → критик → правка → компилятор."
  - "2.1.0: проверка смысла, а не только чисел: цифра сверяется с подписью в брифе, прогноз не выдаётся за результат
    (будущее время, верная сторона «почти / более чем»), сравнения «самая крупная / минимальная» — с данными слайда,
    формула пользователя — дословно, круговая — только доли одного целого; замечания критика о смысле не
    отбрасываются, «вывод повторяет заголовок» исправляется без модели. Скорость и надёжность: время вызовов
    по наблюдаемому темпу, предохранитель при отказах модели, критик пропускается без слайдов модели и один на
    одинаковые планы, правка — одна волна, худшая правка не принимается, ошибка одного слайда не валит колоду."
  - "2.2.0: режим автора: текст, в котором только тема («История VK», «презентация про вторую мировую войну»), агент
    сначала пишет сам — по статье Википедии, когда она нашлась, нейтрально, с датами и цифрами из статьи; цифры и
    имена сверяются со статьёй, проверка фактов только удаляет; живой политик — только биография. Дальше всё как для
    текста пользователя: каждая цифра на слайдах — из написанного текста. Текст с материалом (слайды, списки, цифры)
    собирается строго по нему, как раньше."
