# Final stage (top-10): the main model, Qwen3.8-27B (fp8, id qwen38-27b-fp8), served by VK inference (organisers'
# quickstart 16.10: OpenAI-compatible, key in VK_INFERENCE_API_KEY, header «Project-ID» from VK_PROJECT_ID) — the ТЗ makes VK inference mandatory for
# the top-10 (the organisers: for every model component). Only the endpoint and key change; no other models, no fallback chain: one model.
# A single model: up to 3 attempts with backoff; a 429 of the hosts gets a short pause and one more try (two in a row:
# the model is skipped for 2 minutes); per-minute caps are waited out; a 402 / 401 / 403 / 404 is reported after the
# attempts and the model is skipped for at most 1 minute. Switch to it with VERSTKA_MODELS=configs/models.vk.yaml.
roles:
  llm:
    backend: openai_compat
    model: qwen38-27b-fp8
    label: Qwen3.8-27B (VK)
    base_url: https://ai-demo.platformpreview.ru/api/inference-providers-router/00000000-0000-0000-0000-000000000001/v1
    api_key: ${VK_INFERENCE_API_KEY}
    headers: { Project-ID: "${VK_PROJECT_ID}" }
    # Thinking OFF. Qwen3.8-27B thinks before answering by default; left on, the reasoning is billed as output and
    # uses up the small answers' limits (designer 1800, critic 900 tokens): every answer comes back cut off and the
    # deck is built by the rules after minutes of calls. Two switches, both harmless where unsupported:
    # - vLLM / SGLang (the usual host of an open model): the chat template's own flag;
    # - Qwen3's documented soft switch "/no_think" at the end of the system message (a host without the flag).
    # A host that rejects the unknown field (a plain 400) is asked once more without it, and the provider logs a
    # warning when completion tokens far exceed the answer (thinking still on). Check with scripts/vk_smoke.py first.
    extra_body:
      chat_template_kwargs: { enable_thinking: false }
    system_suffix: "/no_think"
  vlm:
    backend: openai_compat
    model: qwen38-27b-fp8
    label: Qwen3.8-27B (VK)
    base_url: https://ai-demo.platformpreview.ru/api/inference-providers-router/00000000-0000-0000-0000-000000000001/v1
    api_key: ${VK_INFERENCE_API_KEY}
    headers: { Project-ID: "${VK_PROJECT_ID}" }
    extra_body:
      chat_template_kwargs: { enable_thinking: false }
    system_suffix: "/no_think"
  # Pictures (star task) on VK inference when it serves an open text-to-image model (≤ 20B, Apache 2.0 / MIT) through
  # the OpenAI-compatible POST /images/generations; the model id is the host's. Without VK_T2I_MODEL the link is off
  # and the slides keep their free places.
  t2i:
    backend: openai_images
    model: ${VK_T2I_MODEL}
    label: Text-to-image (VK)
    base_url: ${VK_INFERENCE_BASE_URL}
    api_key: ${VK_INFERENCE_API_KEY}
    timeout_s: 120
limits:
  # measured 16.10: 16 parallel requests in 5.2 s with no refusals (text 1.6–3.7 s, an image 1.6 s)
  max_concurrency: 8
  timeout_s: 180
  max_attempts: 3
