# Three layout variants = three composition strategies. Same facts, different grouping, order and slide kinds.
# kind_weights multiply the matcher score for a pattern kind (1.0 = neutral); slide_ratio scales the target slide count.
structured:
  title: Структурный
  description: "Одна мысль на слайд, разделители секций, карточки и списки, классический порядок от общего к частному."
  planner_instructions: |
    Стратегия «Структурный». Одна ключевая мысль на слайд. Используй разделители секций (kind=section) между смысловыми блоками.
    Предпочитай kind=bullets, cards, two_column для содержания; числа подавай как stat_row только там, где их 3 и больше.
    Порядок: титул → повестка → контекст и проблема → решение → детали → план или сроки → выводы → финальный слайд.
  kind_weights: {bullets: 1.2, cards: 1.2, section: 1.15, two_column: 1.0, process: 1.0, table: 1.0, stat_row: 0.9, chart: 0.9, big_number: 0.8, image_text: 0.9, quote: 0.9, agenda: 1.1}
  slide_ratio: 1.0
  synth_threshold: 0.45
  prefer_clone: 1.0
visual:
  title: Визуальный
  description: "Числа крупно, ряды данных в диаграммах, тезисы под иконками, иллюстрации шаблона, минимум текста, выводы в начале."
  planner_instructions: |
    Стратегия «Визуальный». Сначала главный вывод (executive summary), затем доказательства.
    Каждое число из фактов подай как big_number или stat_row; каждый ряд данных как chart; тезисы как cards с icon_hint и не более 12 слов на карточку.
    Без разделителей секций. Текстовые буллеты только там, где без них не обойтись, максимум 4 буллета.
  kind_weights: {big_number: 1.3, stat_row: 1.3, chart: 1.3, image_text: 1.2, mockup: 1.1, cards: 1.05, quote: 1.1, bullets: 0.7, two_column: 0.8, table: 0.85, section: 0.6}
  slide_ratio: 1.0
  synth_threshold: 0.45
  prefer_clone: 0.9
compact:
  title: Компактный
  description: "На треть меньше слайдов, плотные композиции: две колонки, сравнения и таблицы, смежные тезисы объединены, без разделителей."
  planner_instructions: |
    Стратегия «Компактный». Целевое число слайдов на треть меньше базового. Объединяй смежные тезисы в один слайд:
    используй two_column, comparison, table, cards с 4–6 карточками. Никаких разделителей секций и слайдов с одной цифрой.
    Заголовок каждого слайда формулируй как вывод, подзаголовок использовать для контекста.
  kind_weights: {two_column: 1.3, comparison: 1.3, table: 1.2, cards: 1.15, stat_row: 1.0, bullets: 0.9, chart: 0.95, big_number: 0.7, section: 0.4, quote: 0.7}
  slide_ratio: 0.7
  synth_threshold: 0.45
  prefer_clone: 1.0
