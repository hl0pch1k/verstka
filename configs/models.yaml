# Model roles → backends. Only open-weight models (Apache 2.0 / MIT, ≤35B per model).
# Qualifying stage: OpenRouter. Final: the same model on VK inference — change base_url/api_key only.
roles:
  llm:
    backend: openai_compat
    model: qwen/qwen3.8-27b
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    price_in_per_m: 0.42
    price_out_per_m: 3.00
    temperature: 0.2
    json_mode: false  # the host garbles response_format=json_object; the schema is in the prompt
    extra_body:
      reasoning: { enabled: false }
  vlm:
    backend: openai_compat
    model: qwen/qwen3.8-27b
    base_url: https://openrouter.ai/api/v1
    api_key: ${OPENROUTER_API_KEY}
    price_in_per_m: 0.42
    price_out_per_m: 3.00
    temperature: 0.1
    json_mode: false
    extra_body:
      reasoning: { enabled: false }
limits:
  max_concurrency: 6
  timeout_s: 120
  max_attempts: 3
