# Model roles → Polza.ai (https://polza.ai): one key (POLZA_API_KEY in .env), one ruble balance.
# Only open weights with Apache 2.0 / MIT licences: text and vision ≤ 35B, pictures ≤ 20B (ТЗ: «Генеративные модели»,
# star task 3.1). The organisers count the limit per model, not for the sum.
#
#   main      qwen/qwen3.8-27b    Qwen3.8-27B   Apache 2.0, 27.8B, reads images — the model of the VK final
#   backup    qwen/qwen3.6-27b    Qwen3.6-27B   Apache 2.0, 27.8B, reads images — answers when the main one cannot
#   pictures  tongyi-mai/z-image  Z-Image       Apache 2.0, 6.15B + its Qwen3-4B text encoder ≈ 10B
#
# Polza sends each request to one of the model's hosts and moves to another host by itself when one fails. Hosts with
# 4-bit weights (…/fp4) are left out (exclude_quantizations): Qwen garbled JSON on them. The list comes from Polza's
# public catalog (read again every 6 hours); while the catalog is unavailable Polza routes freely.
#
# The chain asks the main model first. The backup answers when the main one cannot: Polza's per-minute or daily cap
# of a model, every host of a model failing, an answer that does not pass the check. A link is skipped for a while
# after
#   402 (no money on the balance, or the spending limit of the key)   10 min
#   404 / 401 / 403 (no such model, a refused key)                    30 min
#   Polza's per-minute cap (429 with Retry-After)                      till the minute ends
#   Polza's daily cap (429 with Retry-After till midnight, Moscow)     till midnight by Moscow time
#   a 503 with a Retry-After over 15 s                                 that long
#   a timeout of the main model                                        1 min at once
#   two 429s of the hosts, or two 5xx / timeouts in a row             2 min / 1 min
# A 402 while the balance is held by parallel requests (their reserve would cover this one) is never a hold: asked
# again in seconds. A 400, a 413 or a refusal of moderation is not asked again and holds nothing. Failed requests cost
# nothing.
#
# Thinking is off (reasoning.effort none): the answers are JSON, and reasoning would be billed as output. The schema of
# every answer is in the prompt (json_mode false); a cut-off or invalid answer is asked again (see openai_compat). The
# temperature is each skill's own (skills/<name>/skill.yaml params).
#
# The final (top-10): the same Qwen3.8-27B on VK inference — configs/models.vk.yaml (VERSTKA_MODELS in .env).
roles:
  llm: &llm
    backend: polza
    base_url: https://polza.ai/api/v1
    api_key: ${POLZA_API_KEY}
    json_mode: false
    exclude_quantizations: [fp4]
    extra_body:
      reasoning: { effort: none }
    chain:
      - model: qwen/qwen3.8-27b
        label: Qwen3.8-27B
      - model: qwen/qwen3.6-27b
        label: Qwen3.6-27B
  vlm: *llm  # the same two models: both read images
  # Pictures inside slides (the star task): the places the author described («[Место под изображение: …]»), graded to
  # the template's palette. Polza's Media API: POST /media {model, input: {prompt, aspect_ratio}} → the picture's
  # link (at once, or after polling GET /media/{id}); 1.40 ₽ a picture. Without the key the slides keep their free
  # places. What is asked and how: configs/images.yaml.
  t2i:
    backend: polza_media
    base_url: https://polza.ai/api/v1
    api_key: ${POLZA_API_KEY}
    model: tongyi-mai/z-image
    label: Z-Image
    timeout_s: 90
limits:
  max_concurrency: 4  # model calls side by side per step
  timeout_s: 120
  max_attempts: 3
  time_budget_s: 210  # model time per generation; past it the deterministic steps take over (render, checks and export fit the rest of the 5 minutes)
