# Writer mode (verstka/planning/writer.py): a topic without material of its own («История VK», «презентация про
# вторую мировую войну») — the agent writes the deck's text, then builds the deck from it. A text with data, slide
# descriptions or lists is always built strictly from the user's text (faithful mode), whatever this file says.
# Switched off for the submission (2026-09-28); back on with the v2 engine (2026-10-08): «Сделай презентацию про
# вторую мировую войну» → a rich, complete deck whose text Verstka writes itself.
enabled: true                 # env VERSTKA_WRITER=1 turns writer mode on, VERSTKA_WRITER=0 off
# v2 (planning/topic_writer.py): the must-know facts and the slides planned first (topic_planner), every slide written
# on its own side by side (topic_slide_writer), every must-know fact checked on its slide, every statement checked by a
# subject expert (topic_fact_check); v1 (planning/writer.py): one call over a Wikipedia cut, every sentence pinned to it
engine: v2
temperature: 0.3              # measured: 0.7 invents battles and conferences
reference:
  enabled: true               # the topic's Wikipedia article as the writer's only source; env VERSTKA_WIKI=0 turns it off
  source: wikipedia
  # REQUIRED by Wikimedia's User-Agent policy (403 without it): a URL or an e-mail to reach the operator.
  # Env VERSTKA_WIKI_CONTACT overrides it. Empty → no Wikipedia requests (the writer uses the model's knowledge).
  # Replace with the team's own page or e-mail before the final.
  contact: "https://i.moscow/hackaton/lct/a964db5a6bd444a6bc5981770f55a080"
  max_chars: 12000            # what the writer reads of the article(s)
  max_chars_history: 18000    # a history / a conflict: the lead whole and every subsection's opening (the turning points)
  timeout_s: 6                # per request; the whole lookup has 12 s
  cache_days: 7               # <workspace>/cache/reference; a stale entry is used when the network fails
anchor:
  enabled: true               # source-anchored writing: the reference is numbered sentence by sentence, the writer cites
                              # the sentences each of its sentences comes from, and every date, name, rank and figure is
                              # checked against them (writer.Anchors); off: the free paraphrase of before
check:
  enabled: true               # the fact check (writer_check): each statement read with its source sentences, in parallel
                              # batches of 12, when ≥ 120 s of the budget remain
limits: {writer_max_s: 100, agent_reserve_s: 110, check_min_left_s: 120}
