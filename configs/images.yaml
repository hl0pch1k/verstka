# Pictures inside slides — the `t2i` role of configs/models.yaml (open weights, Apache 2.0 / MIT, ≤ 20B).
# What is generated: the places the author described in the text («[Место под изображение: экран панели управления]»).
# Never by itself: a place the author keeps for their own photo («Фото я добавлю самостоятельно», «не заполняй это
# место сгенерированным изображением») and a place for a chart, a table or a video without its data — only the
# person's own «Сгенерировать» on that slide fills one.
enabled: true            # a build generates pictures when the t2i role has a model with a key (the create screen's switch can turn it off)
max_per_generation: 8    # different pictures per generation; the variants share them (the same place, the same picture)
concurrency: 3           # pictures asked side by side
timeout_s: 90            # one picture; the generation's 5 minutes bound it too
wait_s: 75               # how long the export waits for the pictures still being made (the places stay free past it)
resolution: "1K"         # OpenRouter's size tier: about a megapixel
max_side_px: 1600        # the picture in the deck, its longer side (cropped to the place's exact proportions first)
jpeg_quality: 88

palette:
  # how far a picture is graded toward the template's palette: a gradient map by lightness — the template's darkest
  # colour, its accent, its lightest colour — blended in (0: as generated, 1: a pure duotone)
  strength: 0.3

# the style by the author's words about the picture (the first rule that matches; the default otherwise)
styles:
  - match: "экран|интерфейс|скриншот|приложени|дашборд|панел[ьи]\\s+управлен|сайт|ui\\b|screen|interface|dashboard|app\\b"
    style: screen
  - match: "схем|диаграмм|инфографик|иллюстрац|рисун|иконк|абстракт|концепт|diagram|illustration|icon|abstract"
    style: illustration
  - match: "фото|снимок|снимк|вид\\b|помещени|здани|люди|человек|команд|photo|picture|view"
    style: photo
default_style: photo

prompt:
  # {subject} — what the picture shows (the author's words, or the model's English for them), {context} — the slide,
  # {style} — the style line below, {colors} — the palette in words, {rules} — what a slide picture never has
  template: "{subject}. {context}. {style}. Colour palette: {colors}. {rules}."
  context: "An image for a presentation slide «{headline}» in a deck about «{deck}»"
  rules: "No text, no letters, no numbers, no captions, no logos, no watermarks"
  styles:
    photo: "Professional editorial photograph, natural soft light, clean uncluttered composition, realistic detail"
    illustration: "Clean modern flat vector illustration, simple geometric shapes, soft gradients, generous negative space"
    screen: "A clean modern software interface on a laptop or tablet screen, simple blocks and charts instead of readable text, soft studio light"
  # the person's wish on «Заменить изображение»: without a text model it leads the subject
  wish: "{wish}. Subject: {subject}"
