# Pictures inside slides — the `t2i` role of configs/models.yaml: Z-Image on Polza (open weights, Apache 2.0, ≈ 10B ≤ 20B).
# What is generated: the places the author described in the text («[Место под изображение: экран панели управления]»).
# Never by itself: a place the author keeps for their own photo («Фото я добавлю самостоятельно», «не заполняй это
# место сгенерированным изображением») and a place for a chart, a table or a video without its data — only the
# person's own «Сгенерировать» on that slide fills one.
enabled: true            # a build generates pictures when the t2i role has a model with a key (the create screen's switch can turn it off)
max_per_generation: 8    # different pictures per generation; the variants share them (the same place, the same picture)
concurrency: 3           # pictures asked side by side
timeout_s: 90            # one picture; the generation's 5 minutes bound it too
wait_s: 75               # how long the export waits for the pictures still being made (the places stay free past it)
max_side_px: 1600        # the picture in the deck, its longer side (cropped to its frame's exact proportions first, around what it shows)
# the picture's form on the slide (rendering/picture_layouts.py): a place in a side column runs out to the slide's edge
# (half of the slide is the picture), a deck of circles or rounded cards gets a round or rounded picture, a place over
# most of the slide is its background with an underlay under the text; off — the picture fills its place as drawn
layouts: true
jpeg_quality: 88

palette:
  # how far a picture is graded toward the template's palette: a gradient map by lightness — the template's darkest
  # colour, its accent, its lightest colour — blended in (0: as generated, 1: a pure duotone)
  strength: 0.3

# the style by the author's words about the picture (the first rule that matches; the default otherwise)
styles:
  - match: "экран|интерфейс|скриншот|приложени|дашборд|панел[ьи]\\s+управлен|сайт|ui\\b|screen|interface|dashboard|app\\b"
    style: screen
  - match: "схем|диаграмм|инфографик|иллюстрац|рисун|иконк|абстракт|концепт|diagram|illustration|icon|abstract"
    style: illustration
  - match: "фото|снимок|снимк|вид\\b|помещени|здани|люди|человек|команд|photo|picture|view"
    style: photo
default_style: photo

prompt:
  # {subject} — what the picture shows (the author's words, or the model's English for them), {context} — the slide,
  # {style} — the style line below, {colors} — the palette in words, {rules} — what a slide picture never has.
  # Z-Image draws text well — and draws every quoted title, value or colour code it is given: the prompt carries no
  # headline, no deck title and no HEX codes, only words for what to draw (the live run of 2026-10-06 put the slide's
  # headline and «#00D3E6» into the pictures)
  template: "{subject}. {context}. {style}. {frame}. Colour palette: {colors}. {rules}."
  max_chars: 1000          # Polza's limit on a picture's prompt: the context goes first, then the end of the subject
  context: "An image for a business presentation slide"
  rules: "The picture contains no text of any kind: no words, no letters, no numbers, no labels, no captions, no logos, no watermarks, no colour codes"
  styles:
    photo: "Professional editorial photograph, natural soft light, clean uncluttered composition, realistic detail"
    illustration: "Clean modern digital illustration, simple smooth forms, soft gradients and soft light, generous negative space"
    # a screen invites pseudo-text and digits: pictograms and progress bars stand for every value, a chart is one curve
    screen: "Clean modern flat vector illustration of a software interface on a laptop screen: pictograms and progress bars instead of any text, every chart is a single smooth curve without axes, ticks, numbers or gridlines; minimalist, soft shadows, generous negative space"
  # the composition of the picture's frame on the slide (images/fill.py: the frame is read before the picture is asked)
  frames:
    tall: "Vertical portrait composition made for a tall frame: one clear main subject seen whole, filling the height, calm background, no borders or frames"
    wide: "Wide landscape composition: one clear main subject, calm background, no borders or frames"
    square: "Balanced square composition: one clear main subject in the middle, calm background, no borders or frames"
    circle: "Centred composition for a circular crop: one clear main subject in the very middle with even space around it, plain soft background"
    background: "Calm wide background scene with large even areas of soft low-contrast tone and the main subject small and off to one side, no borders or frames"
  # the person's wish on «Заменить изображение»: without a text model it leads the subject
  wish: "{wish}. Subject: {subject}"
  # the next attempt after the vision model saw writing in a picture (text_check): the wordless lead and stricter
  # rules; the third attempt draws the subject as a flat illustration (no screen, no page, no sign to write on)
  strict:
    lead: "A wordless image without a single letter or digit."
    rules: "Every surface is blank or carries only simple pictograms: screens show coloured shapes and icons only, papers, boards, signs, labels and packaging are empty, charts are bare curves with no axes, there is no writing, no numbers, no letters, no symbols that read as text anywhere"
    styles:
      screen: "Clean flat vector illustration of a device whose screen shows only soft coloured rounded shapes and simple pictograms, nothing written anywhere; minimalist, generous negative space"
      illustration: "Clean modern flat vector illustration made of simple geometric shapes and pictograms only, soft gradients, generous negative space, nothing written anywhere"
      photo: "Professional editorial photograph, natural soft light, clean uncluttered composition, plain unmarked surfaces"

# every picture is looked at by the vision model before it goes on a slide (images/text_check.py, skill
# image_text_check): writing on it → drawn again from the strict prompt; still writing after the last attempt → the
# place stays free and says why (the model draws letters and digits badly)
text_check:
  enabled: true
  attempts: 3              # the first picture and two stricter ones
