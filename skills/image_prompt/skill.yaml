name: image_prompt
version: 0.5.0
role: llm
description: Turns the author's description of a slide picture (Russian, a few words) and the person's wish into short English prompts for an open-weight text-to-image model.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.images.prompt.ImagePrompts
params:
  temperature: 0.3
  max_tokens: 900
changelog:
  - "0.3.0: the owner (2026-10-08): «модель рисует текст и числа на картинках очень криво» — no subject made of writing (maps, documents, signs, posters, formulas, numbered clocks, keyboards); historical events and people as calm symbolic subjects, never photo-like scenes; every picture is also checked by image_text_check"
  - "0.1.0: initial version"
  - "0.2.0: live run on Polza Z-Image (2026-10-06): the model drew the slide's headline and the palette's colour codes into the pictures, and pseudo-text and digits on every screen — the subject never carries titles, values, labels or timestamps; a screen is tiles with one pictogram and a progress bar each, a chart is one smooth curve (checked live: no text left)"
  - "0.4.0: one clear subject seen whole; a slide without a description is pictured by its concrete subject, never a symbol (the owner, 18.10: a glass trophy for «Бренд и клиентская база»)"
  - "0.5.0: the jury of 20.10: a cloud for «облачные сервисы», an envelope, an arrow «рост» on a slide about rising costs — a place Verstka chose names its thing («Склад — …») and is pictured as that thing; no abstract word of a headline is drawn as a symbol"
