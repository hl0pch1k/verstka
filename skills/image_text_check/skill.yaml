name: image_text_check
version: 2.1.0
role: vlm
description: >
  Looks at one picture the text-to-image model made for a slide and says whether it carries any writing — words,
  letters, digits, numbers, labels, captions, pseudo-text or scribbles that read as text. A picture with writing is
  drawn again from a stricter prompt and never goes on a slide with it (verstka/images/text_check.py).
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.images.text_check.TextCheck
params:
  temperature: 0.0
  max_tokens: 200
changelog:
  - "1.0.0: the owner (2026-10-08): «модель рисует текст и числа на картинках очень криво» — every picture is checked before it goes on a slide"
  - "2.0.0: pictures to the ideal (20.10): the vision model also grades how well the picture fits its slide (0–10: the asked subject, clear, natural; deformed hands, faces, symbols instead of the thing, collages score low) — a picture under configs/images.yaml quality.min_fit is drawn again"
  - "2.1.0: the jury of 20.10, round 4 (a sail and a palm for «касательная» went on the slide): the grade is against the slide's own headline and points, strictly; a picture under min_fit is described again and drawn again once, then left out"
