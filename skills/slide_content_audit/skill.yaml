name: slide_content_audit
version: 0.2.1
role: vlm
description: Answers the 11 yes/no content-validation questions from the ТЗ for one rendered slide, with evidence.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.audit.model_checks.ContentAudit
params:
  temperature: 0.0
  max_tokens: 1200
changelog:
  - "0.1.0: initial version"
