  - "0.2.0: on by default (jury 20.10): question 3 is one idea, not one sentence of text; question 4 answers yes without a registry (data decks: the data checks verify figures); covers and dividers pass the content questions"
  - "0.2.1: the template's logo, page number, footer and marks are never garbage (question 7) — jury 20.10, R01 «tech»"
