name: data_extractor
version: 0.2.0
role: llm
description: Extracts the figures of one part of the brief (per slide block in Agent v2) — facts with units and short labels, numeric series for charts, tables — plus the chart each series fits. Compact answer, no source quotes.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.planning.brief_structure.BlockExtraction
params:
  temperature: 0.0
  max_tokens: 1800
changelog:
  - "0.1.0: initial version"
  - "0.2.0: Agent v2 — runs per block of the brief (planning/brief_structure.enrich_with_model), not on the whole brief; compact answer: no source_span per fact (a 3000-token answer of the whole brief was cut off and read as empty), at most 15 facts; chart hints per series (pie/line/column/bar); output schema BlockExtraction (FactsExtraction + charts); max_tokens 1800"
