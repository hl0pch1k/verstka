name: topic_planner
version: 1.3.0
role: llm
description: >
  Writer mode, step 1 (verstka/planning/topic_writer.py): a request like «Сделай презентацию про вторую мировую войну»
  or «сделай презентацию про интегралы» becomes the deck's plan — the cover, the must-know facts a teacher or an
  expert would never leave out, and the content slides that cover all of them in a logical order, each with the form
  that shows it best (a timeline, key figures, a formula, a table, steps, a chart…).
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.planning.topic_writer.TopicPlan
params:
  temperature: 0.2
  max_tokens: 4000
changelog:
  - "1.0.0: writer mode v2 (2026-10-08): the owner — «насыщенную, полную и готовую презентацию… чтобы ничего не упустить, самые важные и нужные факты». The v1 writer (one call over a Wikipedia cut) left out 9 May 1945 and every formula of «интегралы»"
  - "1.1.0: formulas as typeset LaTeX, each with its explanation in words; math and technical topics are decks of formulas, worked examples and their explanation (2026-10-08)"
  - "1.2.0: the person's knowledge base as the only source of facts (`source: kb`) and the person's plan followed item by item (`plan_items`) (2026-10-17)"
  - "1.2.1: knowledge base mode — every figure on one slide, tables as tables or charts, the closing conclusion and request, no pictures unless asked, timelines only with own dates (qa5, 2026-10-17)"
  - "1.3.0: pictures only where they help (the owner, 18.10): a slide about something one can see that says little — never an abstract slide, never a symbol"
