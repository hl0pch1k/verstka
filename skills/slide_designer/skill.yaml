name: slide_designer
version: 1.3.1
role: llm
description: >
  Designs ONE slide of the deck (Agent v2): chooses its visual form by the visual-form guide and the user's explicit
  requests for the slide (chart type, table, formula, footnote, conclusion), writes the headline as a conclusion,
  a one-line takeaway, speaker notes with the explanations and calculations, short bullets or cards, and puts chart
  data inline (categories + series copied from the data given in the call). Never invents figures or facts: every
  number comes from the slide's source text or data list. Returns why this form was chosen and two alternative
  forms (a more visual one and a more compact one) that the other variants use. One small JSON answer per slide;
  a revision call gets the critic's issues and the previous design.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.schemas.agent.SlideDesignAnswer
params:
  temperature: 0.3
  max_tokens: 1800
changelog:
  - "1.0.0: initial version (Agent v2). One call per slide instead of one call «distributing the brief over the
    slides»: the slide's verbatim source text, the user's requests for it, its data with ids and values, the deck
    context (title, audience, purpose, neighbours' titles), the template's kinds and the visual-form guide. Flat
    model-agnostic JSON (content fields next to the headline), inline chart data, rationale + 2 alternatives. The
    answer is repaired leniently (schemas/agent.py) but an object without a headline and a kind is rejected, so a
    truncated answer never passes as an empty slide."
  - "1.1.0: live run on Cloud.ru Qwen3-32B (long coffee brief): the model copied the user's topic headings («Как
    увеличить средний чек») as headlines, moved the slide's own lists (actions, risks) to the notes, added generic
    footnotes («Результаты зависят от…») and wrote «+10%» for a 20% → 30% share. Now: the headline answers the user's
    heading with the slide's key figure (a neutral example, not from any test brief), the takeaway never repeats it,
    every list of the source stays on the slide, footnotes only when asked or stated by the source, «п. п.» for
    shares, and combined forms (figures + short bullets, a chart + bullets, a lead line over cards / a timeline / a
    table, up to 5 lines under cards / a timeline / a table, which the renderer now shows); a figure keeps its meaning
    and a forecast is never told as done. Deterministic guards in planning/agent.py (design_from_answer): a takeaway
    repeating the headline and a footnote the slide's source does not state are dropped, a footnote that is content
    becomes a line, lines repeating the figures the slide shows big are dropped, fields the chosen form cannot show are
    folded into ones it shows (_fit_form), a headline figure the brief does not give is cut with its preposition or the
    slide's title is used (_headline_checked)."
  - "1.2.0: review of the live decks: a forecast told as done («Операционная прибыль выросла почти в 2,1 раза» over a
    «Цель» column, «почти» on the wrong side of 2,12), a figure given another item's label, «Дополнительно заработать
    90 000 ₽» for the brief's revenue, rankings the data contradicts («Маркетинг и прочие расходы — минимальная
    доля»), headlines announcing lists («Пять стратегий…» for four), a merged «Меры и риски» list, budgets and month
    plans left as text. Now: a figure keeps its label and its source's word for the measure, hedges must be true, no
    ranking the data does not show, no announced lists, takeaways of about 70 characters without a period, a budget
    of amounts → a chart with its total, a plan by months → a timeline, a cost is not an action, risks and measures
    never merged. Deterministic guards (planning/agent.py, compile.py, grounding.py) enforce the same: the tense and
    hedge guard, figure–label binding, the comparison check against the slide's data, the user's formula verbatim,
    pies only of the parts of one whole."
  - "1.3.0: editor's review of two live runs (Qwen3-32B, coffee briefs): vague headlines («Расходы распределены
    неравномерно»), causes the brief does not state («… снижает операционную прибыль до 13,3%», suggested by the
    critic), takeaways restating the headline in other words («Рост выручки на 26,5%» under «Выручка вырастет на
    26,5%»), 3 of 5 observations kept, «более чем в 2,1 раза», a bare formula, plan items titled «Месяц 2» next to
    untitled ones. Now: a specific headline with the key figure (a neutral example of a vague one), no cause, effect
    or classification the source does not state (anywhere on the slide or in the notes), a takeaway adds a figure, a
    total, a condition or a consequence, every item of every list, a formula names its factors, steps titled one way,
    a plain hedge; the revision keeps everything the notes do not ask to change. Deterministic guards (planning/
    agent.py): paraphrase check (adds_nothing) for takeaways and lines, lines repeating the chart / takeaway / headline /
    footnote dropped (tidy_design), causal claims absent from the source dropped (invented_cause), notes the source does
    not say dropped (clean_notes), step titles made uniform, the formula labelled from the slide's text
    (compile.label_formula), key figures and a takeaway the brief asks for added from the brief (complete_slide), the
    revision taken part by part (merge_revision)."
  - "1.3.1: the final live run showed «330» · «Средний чек, ₽» and «30%» · «Цель — доля чеков с едой» (the before values
    gone; the renderer then showed «₽» as the label), card texts «С пятью ближайшими офисами» under their titles, and a
    takeaway beside a chart repeating its value («… до 254 795 рублей в месяц — это 112,3% роста»). Now: a figure's
    value carries its unit and a before/after as «300 → 330 ₽», its label names the measure; a chart slide's lines and
    takeaway never repeat the chart's figures; «рост на 12%». Deterministic guards (planning/agent.py): fix_callouts
    (unit to the value, «Цель —» prefix off, a figure of a before/after pair of the slide's data shown as its change),
    heuristics.label_beside never returns a bare unit, polish_case (lowercase after a label's colon and in a card's
    text that continues its title), plain_change and trim_chart_restatement."
