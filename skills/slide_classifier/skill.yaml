name: slide_classifier
version: 0.1.0
role: llm
description: >
  Classifies one template slide into a pattern kind and assigns a slot role to every shape,
  using a compact JSON description of the shapes (geometry, font sizes, text samples).
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.analysis.classify.SlideClassification
params:
  temperature: 0.1
  max_tokens: 1500
changelog:
  - "0.1.0: initial version"
