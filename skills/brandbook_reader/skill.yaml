name: brandbook_reader
version: 1.0.1
role: vlm
description: >
  Looks at the pages of a PDF brand guideline (palette, typography, logo and rules pages, up to six pictures) next to
  what the program already read from the PDF text, and refines it: the role of each colour (primary, accent, text,
  background, chart…), the heading and body fonts with their fallback, the logo's place on a slide, the slide margins
  and the brand's rules in short Russian sentences. It never invents colours the text does not have (except for a
  scanned PDF without text); without the model the PDF is read from its text alone (verstka/brand/pdf.py).
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.brand.pdf.BrandbookReading
params:
  temperature: 0.1
  max_tokens: 1200
changelog:
  - "1.0.1: review fixes (2026-10-16): the pages are sent at 1600 px or wider so that printed HEX codes stay legible, and a
    colour whose HEX is not printed on the page is never added (no guessing from pixels)."
  - "1.0.0: second stage (2026-10-16): the brandbook is read from text first; the vision model only refines roles,
    fonts and rules on the guideline's pages, and its answer never adds a colour the text does not name."
