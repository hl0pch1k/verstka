name: text_condenser
version: 0.1.0
role: llm
description: Shortens a sentence or bullet to a word budget without losing the meaning or numbers.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.schemas.outline.CondensedText
params:
  temperature: 0.1
  max_tokens: 200
changelog:
  - "0.1.0: initial version"
