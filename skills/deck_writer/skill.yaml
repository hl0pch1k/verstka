name: deck_writer
version: 2.1.0
role: llm
description: >
  Writes the source text of a whole deck from a topic when the user gave no material of their own (writer mode):
  the deck's title and subtitle and, per content slide, a short title, 4–5 sentences of facts, an optional timeline
  of dated events and optional data rows for a chart — neutral, encyclopedic, only well-established facts; with a
  reference text (the topic's Wikipedia article) only the reference's facts. The text then goes through the agent as
  the user's brief would. A continuation call writes the slides a cut or short answer did not.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.schemas.writer.WriterAnswer
params:
  temperature: 0.3
  max_tokens: 4096          # writer.py sets min(6000, 600 + 280 × slides) per call
changelog:
  - "1.0.0: initial version. One call per deck (17–35 s for 5–9 slides on Qwen3-32B); the answer is parsed and
    salvaged by writer.py, not by the provider (no «much shorter» retry: it halved the text); T=0.3."
  - "1.1.0: the timeline is the deck's one dated list, over the whole story (the WWII deck repeated the three dates of
    «Начало» as the first half of «Хронология», «Главное» restated it); a topic about a place («…в России») takes
    that place's facts first, a world figure only as context (the EV deck was filled with the world's top five
    makers and 240 млн cars in the world)."
  - "1.2.0: a history of ≤ 10 slides is a story (causes → start → course → turning points → end → outcome and losses →
    consequences, each working title with a hint of what it tells) with no separate chronology; each figure on one
    slide only; «В войне участвовали», not «Войну участвовали»; the refill branch (a slide the checks emptied is
    written again from the article sections the deck does not use yet, the facts already told listed)."
  - "2.0.0: source-anchored writing. The reference comes with a number before each sentence («[41] …»); the writer
    builds each of its sentences by compressing one or two of them and cites their numbers («… [41, 42].»), timeline
    entries and data rows too. Rule 1 used to say «never copy its sentences: write your own», and the free paraphrase
    moved years, ranks and clock times between events (gate 3: Гуадалканал «1944», «майор» at the launch, «в 1960-х
    началась космическая гонка», «10:53 отделился»). writer.py checks every date, name, rank and figure against the
    cited sentences (Anchors), strips the marks before the designer and the person see the text and keeps them per
    statement (writer.json «sources»)."
  - "2.1.0: the storyline by what a history is the history of (writer.history_subkind: a war — causes … consequences;
    an event — background → preparation → the event → right after → meaning; a thing or a culture — origins → spread
    → development → today; gate 4: «История шоколада» was told as a war); a sentence taken from the reference names
    whom its pronoun, «сын …» or «этот …» stands for; interpretive words only when the cited sentence says them; the
    story goes forward in time across slides. writer.py checks the same deterministically (needs_context, soft_word,
    order_story)."
