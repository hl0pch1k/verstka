name: outline_planner
version: 0.1.0
role: llm
description: >
  Plans the deck: slide kinds, order, headlines as conclusions and per-slide content, respecting the strategy,
  the target slide count, density limits and the facts registry.
prompt_files:
  system: prompts/system.md
  user: prompts/user.md
output_schema: verstka.schemas.outline.PlannedDeck
params:
  temperature: 0.3
  max_tokens: 6000
changelog:
  - "0.1.0: initial version"
